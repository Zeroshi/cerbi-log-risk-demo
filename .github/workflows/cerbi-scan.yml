name: Cerbi Scanner

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  cerbi-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Cerbi Logging Governance Scanner
        id: cerbi
        uses: ./
        with:
          path: .
          policy: policies/cerbi-policy.yml
          fail-on: none
          scanner-version: '1.1.0'
          upload-sarif: 'true'

      - name: Upload Cerbi scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerbi-scan-results
          path: |
            ${{ steps.cerbi.outputs.json-file }}
            ${{ steps.cerbi.outputs.sarif-file }}
            ${{ steps.cerbi.outputs.summary-file }}
          if-no-files-found: error
